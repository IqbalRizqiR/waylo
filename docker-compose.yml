services:
  postgres:
    image: postgres:16-alpine
    container_name: waylo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: waylo
      POSTGRES_PASSWORD: waylo
      POSTGRES_DB: waylo
    ports:
      - "5433:5432"
    volumes:
      - waylo-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waylo -d waylo"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: waylo-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6380:6379"
    volumes:
      - waylo-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: waylo-be
    restart: unless-stopped
    environment:
      PORT: 4000
      NODE_ENV: production
      CORS_ORIGIN: http://localhost:3000
      DATABASE_URL: postgresql://waylo:waylo@postgres:5432/waylo?schema=public
      JWT_ACCESS_SECRET: dev-access-secret-change-me
      JWT_REFRESH_SECRET: dev-refresh-secret-change-me
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
    container_name: waylo-fe
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "3000:3000"
    depends_on:
      - backend

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: waylo-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: postgresql://waylo:waylo@postgres:5432/waylo?sslmode=disable
    ports:
      - "9187:9187"
    depends_on:
      postgres:
        condition: service_healthy

  redis-exporter:
    image: oliver006/redis_exporter:v1.67.0-alpine
    container_name: waylo-redis-exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
    ports:
      - "9121:9121"
    depends_on:
      redis:
        condition: service_healthy

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: waylo-node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"

  prometheus:
    image: prom/prometheus:v2.53.3
    container_name: waylo-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - waylo-prometheus-data:/prometheus
    depends_on:
      - backend
      - postgres-exporter
      - redis-exporter
      - node-exporter

  grafana:
    image: grafana/grafana:10.4.5
    container_name: waylo-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/jhic2-loadtest-warroom.json
    ports:
      - "3001:3000"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/etc/grafana/dashboards:ro
      - waylo-grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

  k6:
    image: grafana/k6:0.50.0
    container_name: waylo-k6
    profiles:
      - loadtest
    volumes:
      - ./scripts:/scripts:ro
    environment:
      - BASE_URL=http://backend:4000
    depends_on:
      - backend

volumes:
  waylo-postgres-data:
  waylo-redis-data:
  waylo-prometheus-data:
  waylo-grafana-data:
