services:
  postgres:
    image: postgres:16-alpine
    container_name: waylo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-waylo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-waylo}
      POSTGRES_DB: ${POSTGRES_DB:-waylo}
    expose:
      - "5432"
    volumes:
      - waylo-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-waylo} -d ${POSTGRES_DB:-waylo}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: waylo-redis
    restart: unless-stopped
    command: redis-server --maxmemory ${REDIS_MAX_MEMORY:-256mb} --maxmemory-policy allkeys-lru
    expose:
      - "6379"
    volumes:
      - waylo-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: waylo-be
    restart: unless-stopped
    environment:
      PORT: 4000
      NODE_ENV: ${NODE_ENV:-production}
      UV_THREADPOOL_SIZE: 1
      CORS_ORIGIN: ${FRONTEND_DOMAIN:-http://localhost:3000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-waylo}:${POSTGRES_PASSWORD:-waylo}@postgres:5432/${POSTGRES_DB:-waylo}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-access-secret-change-me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-change-me}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-7d}
      MIDTRANS_SERVER_KEY: ${MIDTRANS_SERVER_KEY:-SB-Mid-server-waylo-demo}
      MIDTRANS_IS_PRODUCTION: ${MIDTRANS_IS_PRODUCTION:-false}
    ports:
      - "127.0.0.1:${API_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${API_DOMAIN:-http://localhost:4000}
    container_name: waylo-fe
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      UV_THREADPOOL_SIZE: 1
      NEXT_PUBLIC_API_URL: ${API_DOMAIN:-http://localhost:4000}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: waylo-postgres-exporter
    restart: unless-stopped
    profiles:
      - exporters
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:-waylo}:${POSTGRES_PASSWORD:-waylo}@postgres:5432/${POSTGRES_DB:-waylo}?sslmode=disable
    expose:
      - "9187"
    depends_on:
      postgres:
        condition: service_healthy

  redis-exporter:
    image: oliver006/redis_exporter:v1.67.0-alpine
    container_name: waylo-redis-exporter
    restart: unless-stopped
    profiles:
      - exporters
    environment:
      REDIS_ADDR: redis://redis:6379
    expose:
      - "9121"
    depends_on:
      redis:
        condition: service_healthy

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: waylo-node-exporter
    restart: unless-stopped
    profiles:
      - exporters
    expose:
      - "9100"

  prometheus:
    image: prom/prometheus:v2.53.3
    container_name: waylo-prometheus
    restart: unless-stopped
    environment:
      GOMAXPROCS: 1
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    expose:
      - "9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - waylo-prometheus-data:/prometheus
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:10.4.5
    container_name: waylo-grafana
    restart: unless-stopped
    environment:
      GOMAXPROCS: 1
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${MONITORING_DOMAIN:-http://localhost:3001}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/jhic2-loadtest-warroom.json
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/etc/grafana/dashboards:ro
      - waylo-grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

  k6:
    image: grafana/k6:0.50.0
    container_name: waylo-k6
    profiles:
      - loadtest
    volumes:
      - ./scripts:/scripts:ro
    environment:
      - BASE_URL=http://backend:4000
    depends_on:
      - backend

volumes:
  waylo-postgres-data:
  waylo-redis-data:
  waylo-prometheus-data:
  waylo-grafana-data:
